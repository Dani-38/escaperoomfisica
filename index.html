<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room: Fuga dal Carcere di Newton</title>
    <style>
        :root {
            --prison-gray: #2b2b2b;
            --rust: #cd5c5c;
            --glow-green: #39ff14;
        }
        body {
            background-color: #000;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #game-container {
            background-color: var(--prison-gray);
            padding: 30px;
            border: 2px solid #444;
            border-radius: 4px;
            width: 95%;
            max-width: 850px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            position: relative;
        }
        .header { text-align: center; color: var(--rust); border-bottom: 2px solid #444; margin-bottom: 20px; }
        .room-info { margin-bottom: 20px; font-size: 1.1em; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            background: #1a1a1a;
            color: #bbb;
            border: 1px solid #555;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
        }
        .option-btn:hover { background: #333; color: var(--glow-green); border-color: var(--glow-green); }
        .input-area { display: flex; flex-direction: column; gap: 15px; }
        input[type="text"] {
            background: #000;
            border: 1px solid #555;
            color: var(--glow-green);
            padding: 15px;
            font-size: 1.2em;
            outline: none;
        }
        #hint-box {
            margin-top: 20px;
            padding: 15px;
            background: #3e1e1e;
            border-left: 5px solid var(--rust);
            color: #ffcccc;
            display: none;
        }
        #progress { position: absolute; top: 10px; right: 20px; color: #777; font-size: 0.8em; }
        button#submit-btn { background: var(--rust); color: white; border: none; padding: 15px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1em; }
        button#submit-btn:hover { background: #a84343; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="progress">MODULO_EVASIONE | Stanza <span id="current-room-num">1</span>/15</div>
    <div class="header">
        <h1>SISTEMA PENITENZIARIO FISICA</h1>
    </div>
    
    <div id="room-content">
        <div class="room-info" id="room-desc"></div>
        <div id="interactive-element"></div>
    </div>

    <div id="hint-box"></div>
</div>

<script>
const rooms = [
    // --- SEMINTERRATO (1-5) ---
    {
        title: "Sotterraneo - Muro dei Graffiti",
        desc: "Ti trovi davanti a una parete scrostata del seminterrato. Qualcuno ha scritto col gesso: 'Come si definisce lo studio del moto che ignora le forze che lo causano?'.",
        location: "Seminterrato",
        type: "open",
        answer: "cinematica",
        btnText: "PROSEGUI",
        hint: "È il ramo della fisica che descrive il moto indipendentemente dalle cause (forze) che lo producono."
    },
    {
        title: "Sotterraneo - La Cassa Metallica",
        desc: "Nell'angolo del seminterrato trovi una vecchia cassa di metallo da 0,01 m³ con una massa di 78,6 kg. Calcolando la sua densità, consulti le tabelle dei materiali per scoprire di cosa è fatta.",
        img: "https://images.unsplash.com/photo-1558231365-515286576b92?q=80&w=800",
        location: "Seminterrato",
        type: "choice",
        options: ["A) Alluminio (2700 kg/m³)", "B) Ferro (7860 kg/m³)", "C) Piombo (11300 kg/m³)", "D) Rame (8960 kg/m³)"],
        answer: 1, // Ferro
        hint: "La densità è data dal rapporto tra massa e volume (d = m/V)."
    },
    {
        title: "Sotterraneo - Pozzo di Ventilazione",
        desc: "Guardi in alto verso un buco nel soffitto del seminterrato. In quel momento un sasso cade da un'altezza di 10 m. Senza attrito dell'aria, con quale velocità raggiungerà il pavimento?",
        img: "https://images.unsplash.com/photo-1536566482680-fca31930a0bd?q=80&w=800",
        location: "Seminterrato",
        type: "choice",
        options: ["A) 9.8 m/s", "B) 14 m/s", "C) 19.6 m/s", "D) 98 m/s"],
        answer: 1, // sqrt(2*9.8*10) = 14
        hint: "Nel moto di caduta libera, la velocità finale è data dalla formula v = √(2 * g * h)."
    },
    {
        title: "Sotterraneo - Porta Bloccata",
        desc: "Una pesante porta di ferro è completamente ferma. Non si muoverà a meno che una forza esterna non intervenga a modificarne lo stato. Quale principio di Newton descrive questa proprietà della materia?",
        location: "Seminterrato",
        type: "open",
        answer: "principio di inerzia",
        btnText: "SPINGI LA PORTA E VAI OLTRE",
        hint: "È il principio secondo cui ogni corpo permane nel suo stato di quiete o moto rettilineo uniforme finché non intervengono forze esterne."
    },
    {
        title: "Sotterraneo - Il Martinetto Idraulico",
        desc: "Per sollevare una trave rotta trovi un cric idraulico (martinetto). C'è un principio che spiega il funzionamento, basato sui fluidi, di quest'oggetto. Chi lo ha formulato?",
        img: "https://images.unsplash.com/photo-1581092160562-40aa08e78837?q=80&w=800",
        location: "Seminterrato",
        type: "open",
        answer: "pascal",
        btnText: "PROSEGUI",
        hint: "Il principio spiega che la pressione applicata in un punto del fluido si trasmette in tutti i punti di esso con la medesima intesità. Inserisci il nome dello scienziato dietro a questo  principio."
    },
    // --- SCALE (6) ---
    {
        title: "Scale Antincendio",
        desc: "Esci dal seminterrato e sali di corsa le scale antincendio. Percorri uno spostamento Δx di 12 metri in 4 secondi. Qual è la tua velocità media in m/s?",
        location: "Scale",
        type: "open",
        answer: "3",
        btnText: "CONTINUA A SALIRE LE SCALE",
        hint: "La velocità media è definita come il rapporto tra lo spostamento e l'intervallo di tempo: vm = Δx / Δt."
    },
    // --- CORRIDOI E BAGNI (7-10) ---
    {
        title: "Bagni Comuni - Il Sifone",
        desc: "Arrivato al piano successivo, ti nascondi nei bagni abbandonati. Osservi il tubo curvo a 'U' (sifone) sotto il lavandino. Quale principio fisico garantisce che il liquido in equilibrio si porti alla stessa altezza nei due rami del tubo?",
        img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800",
        location: "Bagni",
        type: "choice",
        options: ["A) Principio di Archimede", "B) Vasi Comunicanti", "C) Teorema di Torricelli", "D) Moto Laminare"],
        answer: 1,
        hint: "In due recipienti comunicanti, un fluido omogeneo si porta sempre allo stesso livello. Da che principio è spiegato questo fenomeno?"
    },
    {
        title: "Corridoio - La Conduttura Rotta",
        desc: "Il grande corridoio centrale è allagato d'acqua per un'altezza di 2 metri. Qual è la pressione idrostatica (sovrapressione) sul fondo? (Usa densità acqua = 1000 kg/m³ e g = 9.8 m/s²)",
        img: "https://images.unsplash.com/photo-1510072839530-058866345ec1?q=80&w=800",
        location: "Corridoi",
        type: "choice",
        options: ["A) 20000 Pa", "B) 101325 Pa", "C) 5000 Pa", "D) 1000 Pa"],
        answer: 0, // p = rho*g*h = 1000*9.8*5
        hint: "Applica la legge di Stevino per la pressione idrostatica: p = d * g * h."
    },
    {
        title: "Atrio - La Reazione del Muro",
        desc: "Dalla rabbia tiri un calcio a un muro dell'atrio e avverti subito un forte dolore al piede. Quale principio della dinamica spiega perché il muro esercita a sua volta una forza sul tuo piede?",
        location: "Atrio",
        type: "choice",
        options: ["A) 1° Principio (Inerzia)", "B) 2° Principio (F=ma)", "C) 3° Principio (Azione e Reazione)", "D) Principio di Pascal"],
        answer: 2,
        hint: "Il principio afferma che quando due corpi interagiscono, le forze esercitate l'uno sull'altro sono uguali in modulo e opposte in verso."
    },
    {
        title: "Atrio - Il Terminale Elettronico",
        desc: "Su un vecchio computer di sorveglianza dell'atrio devi digitare il nome dell'unità di misura della Forza nel Sistema Internazionale per sbloccare la porta d'accesso al cortile.",
        location: "Atrio",
        type: "open",
        answer: "newton",
        btnText: "SBLOCCA SERRATURA",
        hint: "Un'unità di forza serve per imprimere un'accelerazione di 1 m/s² a una massa di 1 kg."
    },
    // --- CORTILE (11-15) ---
    {
        title: "Cortile - La Vasca d'Acqua",
        desc: "Nel cortile esterno vedi un pezzo di legno che galleggia in una vasca perché riceve una forza verticale dal basso verso l'alto pari al peso del volume di liquido spostato. Come si chiama questa spinta?",
        location: "Cortile",
        type: "choice",
        options: ["A) Spinta di Stevino", "B) Spinta di Archimede", "C) Portata Volumica", "D) Sforzo Tangenziale"],
        answer: 1,
        hint: "Un corpo immerso in un liquido riceve una spinta verticale dal basso verso l'alto pari al peso del liquido spostato (Spinta di Archimede)."
    },
    {
        title: "Cortile - Le Tubature Esterne",
        desc: "Osservi l'acqua scorrere in un tubo orizzontale che passa da una sezione di 10 cm² a una strozzatura di 2 cm². Se la velocità nella parte larga è v1 = 1 m/s, qual è la velocità v2 (in m/s) nella strozzatura?",
        location: "Cortile",
        type: "open",
        answer: "5", // S1v1 = S2v2 -> 10*1 = 2*v2 -> v2=5
        btnText: "PROSEGUI",
        hint: "Per l'equazione di continuità in un fluido incomprimibile, la portata Q = S * v è costante. Quindi S1 * v1 = S2 * v2."
    },
    {
        title: "Cortile - Caduta di Pressione",
        desc: "Nel condotto orizzontale della stanza precedente, cosa succede alla pressione del fluido ideale nel punto stretto dove la velocità aumenta?",
        location: "Cortile",
        type: "choice",
        options: ["A) La pressione aumenta", "B) La pressione diminuisce", "C) La pressione resta invariata", "D) La pressione si annulla totalmente"],
        answer: 1,
        hint: "Il Teorema di Bernoulli mostra il cambiamento che si ha in un condotto orizzontale in presenza di una strozzatura."
    },
    {
        title: "Cortile - Lancio Oltre la Recinzione",
        desc: "Devi lanciare un gancio con una fune oltre l'alta recinzione del cortile. Trascurando l'aria, con quale angolo di inclinazione ottieni la massima distanza orizzontale (gittata massima)?",
        location: "Cortile",
        type: "choice",
        options: ["A) 30°", "B) 45°", "C) 60°", "D) 90°"],
        answer: 1,
        hint: "Nel moto del proiettile, la gittata massima si ottiene per un angolo di lancio pari a 45°."
    },
    {
        title: "Il Cancello Finale",
        desc: "Per azionare il meccanismo del cancello d'uscita, imposta il valore (in millimetri) dell'altezza della colonna di mercurio nel barometro di Torricelli che bilancia 1 atmosfera a 0 °C.",
        location: "Uscita",
        type: "open",
        answer: "760",
        btnText: "SBLOCCA CANCELLO",
        hint: "1 atmosfera standard corrisponde alla pressione esercitata da una colonna di mercurio alta esattamente..."
    }
];

let currentRoom = 0;

function loadRoom() {
    const room = rooms[currentRoom];
    document.getElementById('current-room-num').innerText = currentRoom + 1;
    document.getElementById('hint-box').style.display = 'none';
    document.getElementById('room-desc').innerHTML = `<strong>${room.title}</strong><br><br>${room.desc}`;
    
    let html = "";
    if (room.type === "open") {
        const buttonLabel = room.btnText || "PROSEGUI";
        html = `<div class="input-area">
                    <input type="text" id="open-ans" placeholder="Inserisci valore o parola...">
                    <button id="submit-btn" onclick="checkOpen()">${buttonLabel}</button>
                </div>`;
    } else {
        html = `<div class="options-grid">`;
        room.options.forEach((opt, idx) => {
            html += `<div class="option-btn" onclick="checkChoice(${idx})">${opt}</div>`;
        });
        html += `</div>`;
    }
    document.getElementById('interactive-element').innerHTML = html;
}

function checkOpen() {
    const val = document.getElementById('open-ans').value.toLowerCase().trim();
    if (val.includes(rooms[currentRoom].answer)) {
        nextRoom();
    } else {
        handleError();
    }
}

function checkChoice(idx) {
    if (idx === rooms[currentRoom].answer) {
        nextRoom();
    } else {
        handleError();
    }
}

function handleError() {
    const hintBox = document.getElementById('hint-box');
    hintBox.innerHTML = "<strong>ALLARME:</strong> Risposta errata.<br>" + rooms[currentRoom].hint;
    hintBox.style.display = 'block';
}

function nextRoom() {
    currentRoom++;
    if (currentRoom < rooms.length) {
        loadRoom();
    } else {
        document.getElementById('game-container').innerHTML = `
            <h1 style="color: var(--glow-green); text-align:center;">EVASIONE RIUSCITA</h1>
            <p style="text-align:center">Sei fuori. Hai superato tutte le trappole del carcere abbandonato applicando i principi e le leggi della fisica. Sei libero!</p>
            <button onclick="location.reload()" style="display:block; margin: 20px auto; padding: 15px; background: var(--rust); color: white; border: none; cursor: pointer; width: 100%; font-family: inherit; font-weight: bold;">RICOMINCIA AVVENTURA</button>
        `;
    }
}

loadRoom();
</script>
</body>
</html>
